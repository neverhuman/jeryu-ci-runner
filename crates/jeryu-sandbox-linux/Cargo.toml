[package]
name = "jeryu-sandbox-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# This crate is the ONLY unsafe island in the runner fabric. It intentionally
# does NOT inherit the workspace lints (which `forbid` unsafe_code); instead it
# uses a crate-local lints table that *allows* unsafe, scoped via inner
# attributes to the launch primitives only.
[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }

[dependencies]
jeryu-runner-core = { path = "../jeryu-runner-core" }
libc = "0.2"
nix = { version = "0.31", features = ["sched", "mount", "user", "process", "signal", "fs"] }
landlock = "0.4"
seccompiler = "0.5"
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
jeryu-test-support = { path = "../jeryu-test-support" }

[[example]]
name = "jail_demo"
path = "examples/jail_demo.rs"

[[example]]
name = "required_capabilities"
path = "examples/required_capabilities.rs"
